<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Saver: Downloads</title>
  <style>
    :root { color-scheme: light dark; --muted: #777; --line: #8884; --accent: #1a73e8; --ok: #1e8e3e; --bad: #c5221f; }
    body { font: 14px system-ui, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; }
    header { display: flex; align-items: baseline; gap: 12px; }
    h1 { font-size: 20px; margin: 0; flex: 1; }
    #summary { color: var(--muted); }
    .note { color: var(--muted); font-size: 12px; margin: 6px 0 18px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q { font-size: 12px; color: var(--muted); }
    .status { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 1em; }
    .status.error { color: var(--bad); }
    .status.done { color: var(--ok); }
    .warn { font-size: 12px; color: #b06000; margin-top: 2px; }
    progress { width: 100%; height: 8px; margin-top: 6px; }
    button { cursor: pointer; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: inherit; padding: 3px 10px; font: inherit; font-size: 12px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Downloads</h1>
    <span id="summary"></span>
    <button id="clear">Clear finished</button>
  </header>
  <p class="note">Keep this tab open while videos download. Up to 3 run at once; the rest wait in line. Files go to your Downloads folder, under “Video Saver”.</p>
  <ul id="list"></ul>
  <script src="compat.js"></script>
  <script src="common.js"></script>
  <script src="hls.js"></script>
  <script src="dash.js"></script>
  <script type="module" src="downloads.js"></script>
</body>
</html>

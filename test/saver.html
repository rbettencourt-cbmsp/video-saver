<!doctype html>
<meta charset="utf-8">
<title>saver scenario</title>
<!-- One end-to-end scenario for saver.js; test/run.html loads this once per scenario.
     Builds a fixture with ffmpeg.wasm, serves it from a fake signed CDN via a stubbed
     fetch (honours Range, can require a Referer), stubs chrome.*, then checks the saved file. -->
<h1 id="title"></h1><code id="src"></code><progress id="bar"></progress>
<p id="status"></p><p id="warn"></p>
<pre id="out"></pre>
<script src="../common.js"></script>
<script src="../hls.js"></script>
<script src="../dash.js"></script>
<script type="module">
import { FFmpeg } from "../vendor/ffmpeg/index.js";

const out = document.getElementById("out");
const say = (s) => (out.textContent += s + "\n");
const core = { coreURL: new URL("../vendor/core/ffmpeg-core.js", import.meta.url).href,
               wasmURL: new URL("../vendor/core/ffmpeg-core.wasm", import.meta.url).href };
const SIG = "?Policy=p&Signature=s&Key-Pair-Id=k";
const CDN = "https://cdn.fake.test";
const BASE = CDN + "/s/";
const REFERRER = "https://www.tiktok.example/@someone/video/123";
const scenario = new URLSearchParams(location.search).get("scenario") || "hls-master";

const AV = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:duration=4", "-f", "lavfi", "-i", "sine=frequency=440:duration=4",
            "-map", "0:v", "-map", "1:a", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-g", "25", "-c:a", "aac"];
const V = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:duration=4", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-g", "25"];
const A = ["-f", "lavfi", "-i", "sine=frequency=440:duration=4", "-c:a", "aac"];

// name -> { cmds, entry, kind, extraFiles?, expect }
const SCENARIOS = {
  "hls-master": {
    kind: "hls", entry: "playlist.m3u8",
    cmds: [[...V, "-f", "hls", "-hls_time", "1", "-hls_list_size", "0", "-hls_segment_filename", "v%d.ts", "video.m3u8"],
           [...A, "-f", "hls", "-hls_time", "1", "-hls_list_size", "0", "-hls_segment_filename", "a%d.ts", "audio.m3u8"]],
    extra: { "playlist.m3u8": `#EXTM3U
#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="aud",NAME="en",DEFAULT=YES,URI="audio.m3u8"
#EXT-X-STREAM-INF:BANDWIDTH=3200000,RESOLUTION=320x240,AUDIO="aud"
video.m3u8
` },
  },
  "hls-byterange": {
    kind: "hls", entry: "stream.m3u8",
    cmds: [[...AV, "-f", "hls", "-hls_time", "1", "-hls_list_size", "0", "-hls_flags", "single_file", "stream.m3u8"]],
    check: (files) => /#EXT-X-BYTERANGE/.test(new TextDecoder().decode(files.get("stream.m3u8"))),
  },
  "dash-timeline": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-use_template", "1", "-use_timeline", "1", "out.mpd"]],
    check: (files) => /SegmentTimeline/.test(new TextDecoder().decode(files.get("out.mpd"))),
  },
  "dash-number": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-use_template", "1", "-use_timeline", "0", "out.mpd"]],
    check: (files) => /\$Number/.test(new TextDecoder().decode(files.get("out.mpd"))) &&
                      !/SegmentTimeline/.test(new TextDecoder().decode(files.get("out.mpd"))),
  },
  "dash-seglist": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-single_file", "1", "-use_template", "0", "-use_timeline", "0", "out.mpd"]],
  },
  "dash-baseurl": { // Facebook/Reddit style: one whole file per representation
    kind: "dash", entry: "manifest.mpd",
    cmds: [[...V, "-an", "v.mp4"], [...A, "-vn", "a.mp4"]],
    extra: { "manifest.mpd": `<?xml version="1.0"?>
<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" type="static" mediaPresentationDuration="PT4S">
 <Period>
  <AdaptationSet contentType="video" mimeType="video/mp4">
   <Representation id="v1" bandwidth="100000" width="320" height="240" codecs="avc1.64000d">
    <BaseURL>v.mp4</BaseURL><SegmentBase indexRange="0-100"><Initialization range="0-50"/></SegmentBase>
   </Representation>
  </AdaptationSet>
  <AdaptationSet mimeType="audio/mp4">
   <Representation id="a1" bandwidth="64000" codecs="mp4a.40.2"><BaseURL>a.mp4</BaseURL></Representation>
  </AdaptationSet>
  <AdaptationSet mimeType="image/jpeg"><Representation id="thumbs" bandwidth="1"><BaseURL>t.jpg</BaseURL></Representation></AdaptationSet>
 </Period>
</MPD>` },
  },
  "file-referrer": { // TikTok style: direct MP4 that 403s without the page's Referer
    kind: "file", entry: "clip.mp4", needReferrer: true,
    cmds: [[...AV, "clip.mp4"]],
  },
  "dash-drm": {
    kind: "dash", entry: "drm.mpd", expectError: /encrypted/i,
    cmds: [],
    extra: { "drm.mpd": `<?xml version="1.0"?>
<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" type="static" mediaPresentationDuration="PT4S"><Period>
 <AdaptationSet contentType="video"><ContentProtection schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"/>
  <Representation id="v" bandwidth="1"><BaseURL>v.mp4</BaseURL></Representation></AdaptationSet>
</Period></MPD>` },
  },
};

function report(result, detail) {
  say(`RESULT: ${result}`);
  parent.postMessage({ scenario, result, detail: out.textContent }, "*");
}

const sc = SCENARIOS[scenario];
if (!new URLSearchParams(location.search).has("url")) {
  const p = new URLSearchParams({ scenario, url: BASE + sc.entry + SIG, kind: sc.kind, name: `Test ${scenario}` });
  if (sc.needReferrer) p.set("referrer", REFERRER);
  location.replace("?" + p);
} else {
  try {
    // 1. Fixture
    const files = new Map();
    if (sc.cmds.length) {
      const ff = new FFmpeg();
      await ff.load(core);
      for (const c of sc.cmds) {
        const code = await ff.exec(c);
        if (code !== 0) throw new Error(`fixture ffmpeg failed (${code}): ${c.join(" ")}`);
      }
      for (const { name, isDir } of await ff.listDir("/")) {
        if (!isDir && /\.(ts|m3u8|mpd|m4s|mp4)$/.test(name)) files.set(name, await ff.readFile(name));
      }
      ff.terminate();
    }
    for (const [n, t] of Object.entries(sc.extra || {})) files.set(n, new TextEncoder().encode(t));
    say(`fixture: ${[...files.keys()].join(", ")}`);
    if (sc.check && !sc.check(files)) throw new Error("fixture does not exercise this scenario");

    // 2. chrome.* stubs (referrer rule is recorded so the fake CDN can enforce it)
    const rules = new Map();
    const saved = [];
    let onChanged = [];
    window.chrome = {
      runtime: { id: "test" },
      tabs: { getCurrent: async () => ({ id: 7 }) },
      declarativeNetRequest: {
        updateSessionRules: async ({ removeRuleIds = [], addRules = [] }) => {
          removeRuleIds.forEach((id) => rules.delete(id));
          addRules.forEach((r) => rules.set(r.id, r));
        },
      },
      downloads: {
        download({ url, filename }, cb) {
          fetch(url).then((r) => r.blob()).then((blob) => {
            saved.push({ filename, blob });
            cb(saved.length);
            setTimeout(() => onChanged.forEach((l) => l({ id: saved.length, state: { current: "complete" } })), 0);
          });
        },
        onChanged: { addListener: (l) => onChanged.push(l), removeListener: (l) => (onChanged = onChanged.filter((x) => x !== l)) },
      },
    };
    const refererSent = () => [...rules.values()].some((r) =>
      r.condition.tabIds?.includes(7) && r.action.requestHeaders?.some((h) => h.header === "referer" && h.value === REFERRER));

    // 3. Fake CDN
    const realFetch = window.fetch;
    const stats = { requests: 0, ranged: 0 };
    window.fetch = async (url, opts = {}) => {
      const u = new URL(url, location.href);
      if (u.origin !== CDN) return realFetch(url, opts);
      stats.requests++;
      if (u.search !== SIG) return new Response("unsigned", { status: 403 });
      if (sc.needReferrer && !refererSent()) return new Response("no referer", { status: 403 });
      const body = files.get(u.pathname.replace("/s/", ""));
      if (!body) return new Response("nf", { status: 404 });
      const range = /bytes=(\d+)-(\d*)/.exec(opts.headers?.Range || "");
      if (range) {
        stats.ranged++;
        const end = range[2] ? Number(range[2]) + 1 : body.length;
        return new Response(body.slice(Number(range[1]), end), { status: 206 });
      }
      return new Response(body, { headers: { "content-length": String(body.length) } });
    };

    // 4. Run the real saver
    await import("../saver.js");
    const status = document.getElementById("status");
    for (let i = 0; i < 240 && !/Saved|error/.test(status.textContent + " " + status.className); i++) {
      await new Promise((r) => setTimeout(r, 250));
    }
    say(`status: ${status.textContent} ${document.getElementById("warn").textContent}`.trim());
    say(`requests: ${stats.requests} (ranged ${stats.ranged}); saved: ${saved.map((s) => `${s.filename} (${s.blob.size} B)`).join(", ") || "none"}`);

    if (sc.expectError) {
      report(status.className === "error" && sc.expectError.test(status.textContent) && !saved.length ? "PASS" : "FAIL");
    } else {
      // 5. Probe the saved file
      const f = saved[0];
      if (!f) throw new Error("nothing saved");
      const probe = new FFmpeg();
      const lines = [];
      probe.on("log", ({ message }) => lines.push(message));
      await probe.load(core);
      await probe.writeFile("r.mp4", new Uint8Array(await f.blob.arrayBuffer()));
      await probe.exec(["-i", "r.mp4"]);
      probe.terminate();
      const info = lines.filter((l) => /Stream #|Duration/.test(l)).join("\n");
      say(info);
      const ok = saved.length === 1 && f.filename.endsWith(".mp4") && /Video: h264/.test(info) && /Audio: aac/.test(info)
        && /Duration: 00:00:0[34]/.test(info) && (scenario !== "hls-byterange" || stats.ranged > 0);
      report(ok ? "PASS" : "FAIL");
    }
  } catch (e) {
    say(String(e.stack || e));
    report("ERROR");
  }
}
</script>

<!doctype html>
<meta charset="utf-8">
<title>job scenario</title>
<!-- One end-to-end scenario for job.js (runJob); test/run.html loads this once per scenario.
     Builds a fixture with ffmpeg.wasm, serves it from a fake signed CDN via a stubbed fetch
     (honours Range, can require a Referer), stubs chrome.*, runs the real job, then probes
     the saved MP4. -->
<pre id="out"></pre>
<script src="../common.js"></script>
<script src="../hls.js"></script>
<script src="../dash.js"></script>
<script type="module">
import { FFmpeg } from "../vendor/ffmpeg/index.js";

const out = document.getElementById("out");
const say = (s) => (out.textContent += s + "\n");
const core = { coreURL: new URL("../vendor/core/ffmpeg-core.js", import.meta.url).href,
               wasmURL: new URL("../vendor/core/ffmpeg-core.wasm", import.meta.url).href };
const SIG = "?Policy=p&Signature=s&Key-Pair-Id=k";
const CDN = "https://cdn.fake.test";
const BASE = CDN + "/s/";
const REFERRER = "https://www.tiktok.example/@someone/video/123";
const scenario = new URLSearchParams(location.search).get("scenario") || "hls-master";

const VIN = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:duration=4"];
const AIN = ["-f", "lavfi", "-i", "sine=frequency=440:duration=4"];
const VENC = ["-c:v", "libx264", "-pix_fmt", "yuv420p", "-g", "25"];
const AENC = ["-c:a", "aac"];
const AV = [...VIN, ...AIN, "-map", "0:v", "-map", "1:a", ...VENC, ...AENC];
const V = [...VIN, ...VENC];
const A = [...AIN, ...AENC];
const HLS = (seg, list) => ["-f", "hls", "-hls_time", "1", "-hls_list_size", "0", "-hls_segment_filename", seg, list];
const text = (files, n) => new TextDecoder().decode(files.get(n));

const MASTER_AUDIO = `#EXTM3U
#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="aud",NAME="en",DEFAULT=YES,URI="audio.m3u8"
#EXT-X-STREAM-INF:BANDWIDTH=3200000,RESOLUTION=320x240,AUDIO="aud"
video.m3u8
`;

// name -> { kind, entry, cmds, extra?, check?, job?, expect? }
const SCENARIOS = {
  "hls-master": {
    kind: "hls", entry: "playlist.m3u8",
    cmds: [[...V, ...HLS("v%d.ts", "video.m3u8")], [...A, ...HLS("a%d.ts", "audio.m3u8")]],
    extra: { "playlist.m3u8": MASTER_AUDIO },
  },
  "hls-chunked": { // same stream merged in many small parts
    kind: "hls", entry: "playlist.m3u8", job: { chunkBytes: 6000 },
    cmds: [[...V, ...HLS("v%d.ts", "video.m3u8")], [...A, ...HLS("a%d.ts", "audio.m3u8")]],
    extra: { "playlist.m3u8": MASTER_AUDIO },
    expect: { parts: true },
  },
  "hls-quality": { // pick the lower of two qualities
    kind: "hls", entry: "playlist.m3u8", job: { quality: { height: 120 } },
    cmds: [[...AV, ...HLS("h%d.ts", "high.m3u8")],
           [...VIN, ...AIN, "-map", "0:v", "-map", "1:a", ...VENC, "-s", "160x120", ...AENC, ...HLS("l%d.ts", "low.m3u8")]],
    extra: { "playlist.m3u8": `#EXTM3U
#EXT-X-STREAM-INF:BANDWIDTH=900000,RESOLUTION=320x240
high.m3u8
#EXT-X-STREAM-INF:BANDWIDTH=300000,RESOLUTION=160x120
low.m3u8
` },
    expect: { size: "160x120", label: "120p" },
  },
  "hls-byterange": {
    kind: "hls", entry: "stream.m3u8",
    cmds: [[...AV, "-f", "hls", "-hls_time", "1", "-hls_list_size", "0", "-hls_flags", "single_file", "stream.m3u8"]],
    check: (files) => /#EXT-X-BYTERANGE/.test(text(files, "stream.m3u8")),
    expect: { ranged: true },
  },
  "dash-timeline": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-use_template", "1", "-use_timeline", "1", "out.mpd"]],
    check: (files) => /SegmentTimeline/.test(text(files, "out.mpd")),
  },
  "dash-number": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-use_template", "1", "-use_timeline", "0", "out.mpd"]],
    check: (files) => /\$Number/.test(text(files, "out.mpd")) && !/SegmentTimeline/.test(text(files, "out.mpd")),
  },
  "dash-quality": { // two video representations; pick 120p
    kind: "dash", entry: "out.mpd", job: { quality: { height: 120 } },
    cmds: [[...VIN, ...AIN, "-map", "0:v", "-map", "0:v", "-map", "1:a", ...VENC, "-s:v:1", "160x120", ...AENC,
            "-adaptation_sets", "id=0,streams=v id=1,streams=a",
            "-f", "dash", "-seg_duration", "1", "-use_template", "1", "-use_timeline", "1", "out.mpd"]],
    check: (files) => (text(files, "out.mpd").match(/<Representation/g) || []).length === 3,
    expect: { size: "160x120", label: "120p" },
  },
  "dash-seglist": {
    kind: "dash", entry: "out.mpd",
    cmds: [[...AV, "-f", "dash", "-seg_duration", "1", "-single_file", "1", "-use_template", "0", "-use_timeline", "0", "out.mpd"]],
  },
  "dash-baseurl": { // Facebook/Reddit style: one whole file per representation
    kind: "dash", entry: "manifest.mpd",
    cmds: [[...V, "-an", "v.mp4"], [...A, "-vn", "a.mp4"]],
    extra: { "manifest.mpd": `<?xml version="1.0"?>
<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" type="static" mediaPresentationDuration="PT4S">
 <Period>
  <AdaptationSet contentType="video" mimeType="video/mp4">
   <Representation id="v1" bandwidth="100000" width="320" height="240" codecs="avc1.64000d">
    <BaseURL>v.mp4</BaseURL><SegmentBase indexRange="0-100"><Initialization range="0-50"/></SegmentBase>
   </Representation>
  </AdaptationSet>
  <AdaptationSet mimeType="audio/mp4">
   <Representation id="a1" bandwidth="64000" codecs="mp4a.40.2"><BaseURL>a.mp4</BaseURL></Representation>
  </AdaptationSet>
  <AdaptationSet mimeType="image/jpeg"><Representation id="thumbs" bandwidth="1"><BaseURL>t.jpg</BaseURL></Representation></AdaptationSet>
 </Period>
</MPD>` },
  },
  "file-referrer": { // TikTok style: direct MP4 that 403s without the page's Referer
    kind: "file", entry: "clip.mp4", needReferrer: true,
    cmds: [[...AV, "clip.mp4"]],
  },
  "wistia-embed": { // player found in page markup, resolved via Wistia's media JSON
    kind: "wistia", embedId: "abcde12345", job: { quality: { height: 240 } },
    cmds: [[...AV, "clip.mp4"]],
    wistia: true,
    expect: { label: "240p" },
  },
  "dash-drm": {
    kind: "dash", entry: "drm.mpd", expectError: /encrypted/i,
    cmds: [],
    extra: { "drm.mpd": `<?xml version="1.0"?>
<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" type="static" mediaPresentationDuration="PT4S"><Period>
 <AdaptationSet contentType="video"><ContentProtection schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"/>
  <Representation id="v" bandwidth="1"><BaseURL>v.mp4</BaseURL></Representation></AdaptationSet>
</Period></MPD>` },
  },
  "cancel": { // abort mid-download: nothing saved, scratch files removed
    kind: "hls", entry: "playlist.m3u8", cancelAfterSegments: 3, expectError: /Cancelled|abort/i,
    cmds: [[...V, ...HLS("v%d.ts", "video.m3u8")], [...A, ...HLS("a%d.ts", "audio.m3u8")]],
    extra: { "playlist.m3u8": MASTER_AUDIO },
  },
};

function report(result) {
  say(`RESULT: ${result}`);
  const storage = new URLSearchParams(location.search).get("storage");
  parent.postMessage({ scenario: storage ? `${scenario} (${storage} storage)` : scenario, result, detail: out.textContent }, "*");
}

const sc = SCENARIOS[scenario];
try {
  // 1. Fixture
  const files = new Map();
  if (sc.cmds.length) {
    const ff = new FFmpeg();
    await ff.load(core);
    for (const c of sc.cmds) {
      const code = await ff.exec(c);
      if (code !== 0) throw new Error(`fixture ffmpeg failed (${code}): ${c.join(" ")}`);
    }
    for (const { name, isDir } of await ff.listDir("/")) {
      if (!isDir && /\.(ts|m3u8|mpd|m4s|mp4)$/.test(name)) files.set(name, await ff.readFile(name));
    }
    ff.terminate();
  }
  for (const [n, t] of Object.entries(sc.extra || {})) files.set(n, new TextEncoder().encode(t));
  say(`fixture: ${[...files.keys()].join(", ")}`);
  if (sc.check && !sc.check(files)) throw new Error("fixture does not exercise this scenario");

  // 2. chrome.* stubs (header rules are recorded so the fake CDN can enforce them)
  const rules = new Map();
  const saved = [];
  let onChanged = [];
  window.chrome = {
    runtime: { id: "testextid" },
    declarativeNetRequest: {
      updateSessionRules: async ({ removeRuleIds = [], addRules = [] }) => {
        removeRuleIds.forEach((id) => rules.delete(id));
        addRules.forEach((r) => rules.set(r.id, r));
      },
    },
    downloads: {
      // Promise style, like the real API in both Chrome (MV3) and Firefox.
      async download({ url, filename }) {
        const blob = await (await fetch(url)).blob();
        saved.push({ filename, blob });
        const id = saved.length;
        setTimeout(() => onChanged.forEach((l) => l({ id, state: { current: "complete" } })), 0);
        return id;
      },
      onChanged: { addListener: (l) => onChanged.push(l), removeListener: (l) => (onChanged = onChanged.filter((x) => x !== l)) },
    },
  };
  const refererSentTo = (host) => [...rules.values()].some((r) =>
    r.condition.requestDomains?.includes(host) && r.condition.initiatorDomains?.includes("testextid") &&
    r.action.requestHeaders?.some((h) => h.header === "referer" && h.value === REFERRER));

  // 3. Fake network: signed CDN (+ Wistia's media JSON for the embed scenario)
  const realFetch = window.fetch;
  const stats = { requests: 0, ranged: 0, segments: 0 };
  const controller = new AbortController();
  window.fetch = async (url, opts = {}) => {
    const u = new URL(url, location.href);
    if (u.host === "fast.wistia.com" && sc.wistia) {
      return new Response(JSON.stringify({ media: { assets: [
        { type: "hd_mp4_video", display_name: "720p", container: "mp4", height: 720, url: BASE + "missing.bin" + SIG },
        { type: "md_mp4_video", display_name: "240p", container: "mp4", height: 240, url: BASE + "clip.mp4" + SIG },
        { type: "still_image", display_name: "Thumbnail", url: BASE + "t.jpg" },
      ] } }), { headers: { "content-type": "application/json" } });
    }
    if (u.origin !== CDN) return realFetch(url, opts);
    stats.requests++;
    if (opts.signal?.aborted) throw new DOMException("Aborted", "AbortError");
    if (u.search !== SIG) return new Response("unsigned", { status: 403 });
    if (sc.needReferrer && !refererSentTo(u.hostname)) return new Response("no referer", { status: 403 });
    const name = u.pathname.replace("/s/", "");
    const body = files.get(name);
    if (!body) return new Response("nf", { status: 404 });
    if (/\.(ts|m4s)$/.test(name) && ++stats.segments === sc.cancelAfterSegments) setTimeout(() => controller.abort(), 0);
    const range = /bytes=(\d+)-(\d*)/.exec(opts.headers?.Range || "");
    if (range) {
      stats.ranged++;
      const end = range[2] ? Number(range[2]) + 1 : body.length;
      return new Response(body.slice(Number(range[1]), end), { status: 206 });
    }
    return new Response(body, { headers: { "content-length": String(body.length) } });
  };

  // 4. Run the real job (after clearing leftovers from earlier runs)
  {
    const d = await (await navigator.storage.getDirectory()).getDirectoryHandle("video-saver-jobs", { create: true });
    for await (const n of d.keys()) if (n.startsWith(`test-${scenario}`)) await d.removeEntry(n).catch(() => {});
  }
  // ?storage=broken: the browser's file storage never answers, like a damaged profile.
  // The job must fall back to memory and still save the video.
  const brokenStorage = new URLSearchParams(location.search).get("storage") === "broken";
  const realGetDirectory = navigator.storage.getDirectory;
  if (brokenStorage) navigator.storage.getDirectory = () => new Promise(() => {});
  const { runJob } = await import("../job.js");
  const job = { id: `test-${scenario}`, kind: sc.kind, url: sc.entry ? BASE + sc.entry + SIG : undefined,
                embedId: sc.embedId, name: `Test ${scenario}`, referrer: REFERRER, ...(sc.job || {}) };
  const reports = [];
  let error = null;
  try {
    await runJob(job, { signal: controller.signal, report: (p) => reports.push(p) });
  } catch (e) {
    error = e;
  }
  if (brokenStorage) {
    navigator.storage.getDirectory = realGetDirectory;
    say(`scratch storage used: ${(await import("../store.js")).scratchMode()}`);
  }
  const messages = reports.map((r) => r.message).filter(Boolean);
  const label = reports.map((r) => r.qualityLabel).filter(Boolean).at(-1) || "";
  say(`last status: ${messages.at(-1) || ""}${error ? ` | error: ${error.name}: ${error.message}` : ""}`);
  say(`requests: ${stats.requests} (ranged ${stats.ranged}); quality: ${label || "-"}; saved: ${saved.map((s) => `${s.filename} (${s.blob.size} B)`).join(", ") || "none"}`);

  // Scratch files must be cleaned up either way.
  const dir = await (await navigator.storage.getDirectory()).getDirectoryHandle("video-saver-jobs", { create: true });
  const leftovers = [];
  for await (const n of dir.keys()) if (n.startsWith(job.id)) leftovers.push(n);
  if (leftovers.length) say(`leftover scratch files: ${leftovers.join(", ")}`);

  if (sc.expectError) {
    report(error && sc.expectError.test(`${error.name} ${error.message}`) && !saved.length && !leftovers.length ? "PASS" : "FAIL");
  } else {
    if (error) throw error;
    const f = saved[0];
    if (!f) throw new Error("nothing saved");
    const probe = new FFmpeg();
    const lines = [];
    probe.on("log", ({ message }) => lines.push(message));
    await probe.load(core);
    await probe.writeFile("r.mp4", new Uint8Array(await f.blob.arrayBuffer()));
    await probe.exec(["-i", "r.mp4"]);
    const info = lines.filter((l) => /Stream #|Duration/.test(l)).join("\n");
    lines.length = 0;
    await probe.exec(["-v", "error", "-i", "r.mp4", "-f", "null", "-"]);
    const decodeErrors = lines.filter((l) => l.trim() && !/^frame=|^size=|Aborted/.test(l));
    probe.terminate();
    say(info);
    if (decodeErrors.length) say("decode errors: " + decodeErrors.slice(0, 3).join(" | "));
    const partMsgs = new Set(messages.filter((m) => /part \d+ of/.test(m)));
    if (partMsgs.size) say(`merged in ${partMsgs.size} parts`);
    const e = sc.expect || {};
    const ok = saved.length === 1 && f.filename === `Video Saver/Test ${scenario}.mp4` &&
      /Video: h264/.test(info) && /Audio: aac/.test(info) && /Duration: 00:00:0[34]/.test(info) &&
      !decodeErrors.length && !leftovers.length &&
      (!e.ranged || stats.ranged > 0) && (!e.parts || partMsgs.size > 2) &&
      (!e.size || new RegExp(`, ${e.size}[ ,]`).test(info)) && (!e.label || label === e.label);
    report(ok ? "PASS" : "FAIL");
  }
} catch (e) {
  say(String(e.stack || e));
  report("ERROR");
}
</script>

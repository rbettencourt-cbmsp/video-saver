<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Saving video…</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1d1d1f; }
    progress { width: 100%; height: 18px; }
    .note { color: #666; }
    .warn { color: #a15c00; }
    .error { color: #b00020; }
    code { word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <h1 id="title">Saving video</h1>
  <p><code id="src"></code></p>
  <progress id="bar" value="0" max="1"></progress>
  <p id="status">Starting…</p>
  <p id="warn" class="warn"></p>
  <p class="note">Keep this tab open until the download starts.</p>
  <script src="common.js"></script>
  <script src="hls.js"></script>
  <script src="dash.js"></script>
  <script type="module" src="saver.js"></script>
</body>
</html>

# Builds the ready-to-install packages and publishes them on a GitHub release.
#
# Two ways to make a release (either works):
#  * Push a version tag:   git tag v0.6.0 && git push origin v0.6.0
#    → this workflow creates the release and attaches the ZIPs.
#  * Or publish a release on GitHub (Releases → Draft a new release, tag v0.6.0)
#    → this workflow attaches the ZIPs to it.
# It can also be run by hand (Actions → Build packages → Run workflow); the ZIPs are then
# a downloadable artifact on the run's page.
name: Build packages

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and attach files

# A release created on GitHub also creates its tag; don't let both runs upload at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest # the YouTube helper and its tests are Windows-specific
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (also copies ffmpeg.wasm into vendor/)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches manifest.json
        if: github.event_name != 'workflow_dispatch'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version. Update the version in manifest.json and package.json, push, then tag again."
            exit 1
          fi

      - name: Build Chrome, Firefox and YouTube-helper packages
        run: npm run build

      - name: Check the Firefox package with Mozilla's linter
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - name: Keep the ZIPs as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-saver-packages
          path: dist/*.zip

      - name: Create or update the GitHub release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            cat > notes.md <<EOF
          Download the package for your browser below, then follow the install steps in the [README](https://github.com/${GITHUB_REPOSITORY}#install).

          | File | For |
          |---|---|
          | \`video-saver-chrome-${tag#v}.zip\` | Chrome, Edge, Brave, Opera, Vivaldi (includes the YouTube helper) |
          | \`video-saver-firefox-${tag#v}.zip\` | Firefox 128+ (load temporarily, or upload to addons.mozilla.org to sign) |
          | \`video-saver-youtube-helper-${tag#v}.zip\` | The YouTube helper on its own, for Firefox users (Windows) |
          EOF
            sed -i 's/^          //' notes.md
            gh release create "$tag" dist/*.zip --title "Video Saver ${tag#v}" --notes-file notes.md --latest
          fi
